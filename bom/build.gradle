plugins {
    id 'java-platform'
    id 'maven-publish'
}

// group and version come from the root gradle.properties.
// The published artifactId is the 'bomArtifact' property (also gradle.properties).
description = 'Bill of Materials for the Mifos Payment Hub connector ecosystem. ' +
        'Governs Jakarta EE 10, Spring Boot 3.4, Apache Camel 4, and Zeebe 8 across all PH-EE connectors.'

// allowDependencies() is required to import other BOMs (Spring Boot BOM, Camel BOM)
// via 'api platform(...)'. Without it, the java-platform plugin forbids dependencies.
javaPlatform {
    allowDependencies()
}

repositories {
    mavenCentral()
    // Camunda / Zeebe artifacts are not on Maven Central
    maven { url = uri('https://artifacts.camunda.com/artifactory/zeebe-io/') }
    maven { url = uri('https://artifacts.camunda.com/artifactory/zeebe-io-snapshots/') }
}

dependencies {
    // ── Imported BOMs ─────────────────────────────────────────────────────────
    // Using 'api platform(...)' re-exports these BOMs to every connector that
    // imports this BOM. Connectors do NOT need to import Spring
    // Boot BOM or Camel BOM separately — they get everything from this one import.
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    // camel-bom pins the plain org.apache.camel:* modules (camel-core, camel-cxf, etc.)
    // used directly by libraries like the core module that do not depend on the
    // Spring Boot starters. camel-spring-boot-bom only governs camel-*-starter modules.
    api platform("org.apache.camel:camel-bom:${camelVersion}")
    api platform("org.apache.camel.springboot:camel-spring-boot-bom:${camelVersion}")
    // AWS SDK v2 BOM governs all software.amazon.awssdk:* modules.
    // Required by ph-ee-operations-app (migrating from SDK v1 com.amazonaws:1.11.x).
    // SDK v2 is on Maven Central; no extra repository needed.
    api platform("software.amazon.awssdk:bom:${awsSdkVersion}")

    constraints {
        // ── Zeebe / Camunda ───────────────────────────────────────────────────
        // Not included in Spring Boot or Camel BOMs.
        api "io.camunda:spring-zeebe-starter:${zeebeVersion}"
        api "io.camunda:zeebe-client-java:${zeebeVersion}"
        api "io.camunda:zeebe-bpmn-model:${zeebeVersion}"
        // Broker-side APIs, used by the Kafka exporter plugin in
        // paymenthub-ee-data-pipeline. The plugin takes them compileOnly: the
        // broker already holds these classes and supplies them at runtime, so
        // none of this ends up in the exporter jar. They do NOT have to equal
        // the version of the running broker -- the Exporter SPI is stable across
        // the 8.x line, and the exporter deployed today is built against 8.1.1
        // and runs fine in a broker that is not 8.1. They follow zeebeVersion to
        // stay consistent with the clients above, which is the only reason.
        api "io.camunda:zeebe-exporter-api:${zeebeVersion}"
        api "io.camunda:zeebe-protocol:${zeebeVersion}"

        // ── Prometheus client ─────────────────────────────────────────────────
        // The Zeebe broker exposes its metrics through the legacy Prometheus
        // simpleclient and ships 0.16.0. The Kafka exporter registers its own
        // histograms in that same registry, so it compiles against the version
        // the broker carries -- compileOnly, for the same reason as above.
        api "io.prometheus:simpleclient:${prometheusSimpleclientVersion}"

        // ── Apache CXF ────────────────────────────────────────────────────────
        // CXF 3.x uses javax.*; CXF 4.x uses jakarta.*.
        // Required by ph-ee-connector-ams-mifos which uses CXF for its
        // Fineract SOAP/REST integration via Apache Camel's camel-cxf component.
        api "org.apache.cxf:cxf-core:${cxfVersion}"
        api "org.apache.cxf:cxf-rt-rs-client:${cxfVersion}"
        api "org.apache.cxf:cxf-rt-frontend-jaxrs:${cxfVersion}"
        api "org.apache.cxf:cxf-rt-transports-http:${cxfVersion}"

        // ── SpringDoc OpenAPI ─────────────────────────────────────────────────
        // Replaces the deprecated Springfox / springfox-swagger-ui libraries.
        // springfox 3.x is incompatible with Spring Boot 3; springdoc 2.x is.
        api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
        api "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}"

        // ── Security & JWT ────────────────────────────────────────────────────
        api "com.auth0:java-jwt:${javaJwtVersion}"
        api "com.nimbusds:nimbus-jose-jwt:${nimbusJoseJwtVersion}"

        // ── Apache Commons ────────────────────────────────────────────────────
        api "commons-io:commons-io:${commonsIoVersion}"

        // ── JPA Providers ─────────────────────────────────────────────────────
        // EclipseLink 4.x implements Jakarta Persistence 3.0 (jakarta.persistence.*).
        // EclipseLink 2.7.x implements javax.persistence and is incompatible with
        // Spring Boot 3. Required by ph-ee-operations-app, ph-ee-importer-rdbms,
        // and ph-ee-identity-account-mapper, which all use EclipseLink as the JPA
        // provider instead of Hibernate.
        // NOTE: connectors that use Hibernate (the Spring Boot default) do not need
        // to declare this — they inherit Hibernate 6 from the Spring Boot BOM above.
        api "org.eclipse.persistence:eclipselink:${eclipselinkVersion}"
        // ph-ee-importer-rdbms depends on the standalone JPA artifact instead of
        // the eclipselink aggregate — both must resolve to the same version.
        api "org.eclipse.persistence:org.eclipse.persistence.jpa:${eclipselinkVersion}"

        // ── Cloud storage (ph-ee-operations-app) ──────────────────────────────
        api "com.azure:azure-storage-blob:${azureStorageBlobVersion}"

        // ── Mastercard connector ──────────────────────────────────────────────
        api "com.mastercard.developer:oauth1-signer:${mastercardOauth1Version}"

        // ── JSON ──────────────────────────────────────────────────────────────
        // org.json is not managed by the Spring Boot BOM.
        api "org.json:json:${orgJsonVersion}"

        // ── Elasticsearch 7 legacy client ─────────────────────────────────────
        // ph-ee-zeebe-ops codes against the ES7 RestHighLevelClient API, removed
        // from Spring Boot 3 / Spring Data ES 5. Last 7.17.x keeps it working
        // against Gazelle's ES7 cluster until a proper client rewrite.
        api "org.elasticsearch.client:elasticsearch-rest-high-level-client:${es7RestHighLevelClientVersion}"
        api "org.elasticsearch.client:elasticsearch-rest-client:${es7RestHighLevelClientVersion}"
    }
}

publishing {
    publications {
        mavenBom(MavenPublication) {
            from components.javaPlatform
            artifactId = bomArtifact

            pom {
                name = bomArtifact
                description = project.description
                url = 'https://github.com/openMF/paymenthub-ee-core'

                licenses {
                    license {
                        name = 'Mozilla Public License 2.0'
                        url = 'https://www.mozilla.org/en-US/MPL/2.0/'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/openMF/paymenthub-ee-core.git'
                    developerConnection = 'scm:git:ssh://github.com/openMF/paymenthub-ee-core.git'
                    url = 'https://github.com/openMF/paymenthub-ee-core'
                }
            }
        }
    }

    repositories {
        // Mifos JFrog Artifactory. Credentials are supplied at publish time via
        // gradle properties / env vars (never stored in this repo).
        maven {
            name = 'MifosArtifactory'
            def isSnapshot = version.toString().endsWith('SNAPSHOT')
            def repoKey = isSnapshot ? 'phee-gradle-local' : 'oss-release-local'
            url = uri("https://mifos.jfrog.io/artifactory/${repoKey}")
            credentials {
                username = findProperty('artifactory.user') ?: System.getenv('MIFOS_ARTIFACTORY_USER')
                password = findProperty('artifactory.key') ?: System.getenv('MIFOS_ARTIFACTORY_TOKEN')
            }
        }
    }
}
